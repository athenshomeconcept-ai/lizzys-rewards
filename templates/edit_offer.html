{% extends "base.html" %}

{% block content %}

<div class="page-head">
  <div>
    <span class="eyebrow">ADMIN</span>
    <h1>Επεξεργασία προσφοράς</h1>
  </div>

  <a class="btn secondary" href="{{ url_for('dashboard') }}">
    ← Επιστροφή
  </a>
</div>


<section class="panel" style="margin-top:20px;">

  <div class="panel-head">
    <div>
      <span class="eyebrow">ΠΡΟΣΦΟΡΑ</span>
      <h2>{{ offer.title }}</h2>
    </div>
  </div>


  <form
    class="form"
    method="post"
    action="{{ url_for('edit_offer', offer_id=offer.id) }}"
  >

    <label>
      Τίτλος προσφοράς
      <input
        type="text"
        name="title"
        value="{{ offer.title or '' }}"
        required
      >
    </label>


    <label>
      Περιγραφή
      <textarea
        name="description"
        rows="4"
        placeholder="Περιγραφή της προσφοράς"
      >{{ offer.description or '' }}</textarea>
    </label>


    <label>
      Τύπος προσφοράς
      <select name="offer_type">
        <option value="" {% if not offer.offer_type %}selected{% endif %}>
          Επιλέξτε
        </option>

        <option value="discount"
          {% if offer.offer_type == 'discount' %}selected{% endif %}>
          Έκπτωση
        </option>

        <option value="double_stamps"
          {% if offer.offer_type == 'double_stamps' %}selected{% endif %}>
          Διπλές σφραγίδες
        </option>

        <option value="gift"
          {% if offer.offer_type == 'gift' %}selected{% endif %}>
          Δώρο
        </option>

        <option value="product"
          {% if offer.offer_type == 'product' %}selected{% endif %}>
          Προϊόν
        </option>

        <option value="custom"
          {% if offer.offer_type == 'custom' %}selected{% endif %}>
          Άλλη προσφορά
        </option>
      </select>
    </label>


    <label>
      Προϊόν / Κατηγορία
      <input
        type="text"
        name="product"
        value="{{ offer.product or '' }}"
        placeholder="π.χ. Freddo Espresso"
      >
    </label>


    <div style="
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    ">

      <label>
        Ημερομηνία έναρξης
        <input
          type="date"
          name="start_date"
          value="{{ offer.start_date or '' }}"
        >
      </label>

      <label>
        Ημερομηνία λήξης
        <input
          type="date"
          name="end_date"
          value="{{ offer.end_date or '' }}"
        >
      </label>

      <label>
        Ώρα έναρξης
        <input
          type="time"
          name="start_time"
          value="{{ offer.start_time or '' }}"
        >
      </label>

      <label>
        Ώρα λήξης
        <input
          type="time"
          name="end_time"
          value="{{ offer.end_time or '' }}"
        >
      </label>

    </div>


    <label>
      Σε ποιους πελάτες
      <select name="target_group">

        <option value="all"
          {% if offer.target_group == 'all' %}selected{% endif %}>
          Όλοι οι πελάτες
        </option>

        <option value="active"
          {% if offer.target_group == 'active' %}selected{% endif %}>
          Ενεργοί πελάτες
        </option>

        <option value="inactive"
          {% if offer.target_group == 'inactive' %}selected{% endif %}>
          Ανενεργοί πελάτες
        </option>

        <option value="top"
          {% if offer.target_group == 'top' %}selected{% endif %}>
          Κορυφαίοι πελάτες
        </option>

      </select>
    </label>


    <div style="
      display:flex;
      gap:12px;
      margin-top:24px;
      flex-wrap:wrap;
    ">

      <button
        class="btn primary"
        type="submit"
      >
        Αποθήκευση αλλαγών
      </button>

      <a
        class="btn secondary"
        href="{{ url_for('dashboard') }}"
      >
        Ακύρωση
      </a>

    </div>

  </form>

</section>


{% endblock %}
